services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
    ports: ["5433:5432"]
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gallery]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [gallery]

  api:
    build: ./apps/api
    volumes:
      - ./apps/api:/app
      - ./volumes/media_data:/var/gallery/media
    env_file: .env
    # Host 8080 is often taken (e.g. phpMyAdmin); use 8081 for the gallery API.
    ports: ["8081:80"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [gallery]

  worker-convert:
    build: ./apps/api
    # Consumes `convert` (AVIF/thumbnail), `faces` (DetectFacesHandler bridge
    # to gallery:faces), and `tags` (SuggestTagsHandler bridge to gallery:tags).
    # Run as www-data so converted files share ownership with php-fpm uploads.
    command: >-
      su -s /bin/sh www-data -c
      'php bin/console messenger:consume convert faces tags -vv --time-limit=3600'
    volumes:
      - ./apps/api:/app
      - ./volumes/media_data:/var/gallery/media
    env_file: .env
    depends_on: [api, redis, postgres]
    networks: [gallery]

  worker-faces:
    build: ./apps/worker-faces
    volumes:
      - ./apps/worker-faces:/app
      - ./volumes/media_data:/var/gallery/media
    env_file: .env
    depends_on: [redis, postgres]
    networks: [gallery]

  worker-tags:
    build: ./apps/worker-tags
    volumes:
      - ./apps/worker-tags:/app
      - ./volumes/media_data:/var/gallery/media
      - tags_model_cache:/root/.cache
    env_file: .env
    depends_on: [redis, postgres]
    networks: [gallery]

  frontend:
    build: ./apps/web
    volumes: [./apps/web:/app]
    ports: ["5173:5173"]
    env_file: .env
    depends_on: [api]
    networks: [gallery]

networks:
  gallery:
    name: gallery

volumes:
  tags_model_cache:
