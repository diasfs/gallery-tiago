services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
    ports: ["5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gallery]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [gallery]

  api:
    build: ./apps/api
    volumes:
      - ./apps/api:/app
      - media_data:/var/gallery/media
    env_file: .env
    # Host 8080 is often taken (e.g. phpMyAdmin); use 8081 for the gallery API.
    ports: ["8081:80"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [gallery]

  worker-convert:
    build: ./apps/api
    # Consumes both `convert` (AVIF/thumbnail conversion) and `faces`
    # (DetectFacesHandler, which only bridges to the Redis list
    # `gallery:faces` for apps/worker-faces to BRPOP — see Task 7). Kept in
    # one PHP consumer process for simplicity; split into its own service if
    # face-bridge volume ever needs independent scaling/restarts.
    command: php bin/console messenger:consume convert faces -vv --time-limit=3600
    volumes:
      - ./apps/api:/app
      - media_data:/var/gallery/media
    env_file: .env
    depends_on: [api, redis, postgres]
    networks: [gallery]

  worker-faces:
    build: ./apps/worker-faces
    volumes:
      - ./apps/worker-faces:/app
      - media_data:/var/gallery/media
    env_file: .env
    depends_on: [redis, postgres]
    networks: [gallery]

  frontend:
    build: ./apps/web
    volumes: [./apps/web:/app]
    ports: ["5173:5173"]
    env_file: .env
    depends_on: [api]
    networks: [gallery]

volumes:
  pg_data:
  media_data:

networks:
  gallery:
    name: gallery
