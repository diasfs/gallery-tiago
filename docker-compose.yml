services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    volumes:
      - ./apps/api:/app
      - media_data:/var/gallery/media
    env_file: .env
    ports: ["8080:80"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker-convert:
    build: ./apps/api
    command: php bin/console messenger:consume convert -vv --time-limit=3600
    volumes:
      - ./apps/api:/app
      - media_data:/var/gallery/media
    env_file: .env
    depends_on: [api, redis, postgres]

  worker-faces:
    build: ./apps/worker-faces
    volumes:
      - ./apps/worker-faces:/app
      - media_data:/var/gallery/media
    env_file: .env
    depends_on: [redis, postgres]

  frontend:
    build: ./apps/web
    volumes: [./apps/web:/app]
    ports: ["5173:5173"]
    env_file: .env
    depends_on: [api]

volumes:
  pg_data:
  media_data:
