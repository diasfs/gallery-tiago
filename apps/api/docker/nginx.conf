server {
    listen 80;
    server_name _;
    root /app/public;

    # MediaStorage (see src/Service/MediaStorage.php) persists paths under
    # MEDIA_ROOT (mounted at /var/gallery/media, see docker-compose.yml)
    # relative to that root. Symfony's public/ only holds the front
    # controller, so nginx must alias these prefixes directly to the media
    # volume rather than falling through to try_files/PHP.

    # Converted AVIF master images and thumbnails: safe to serve publicly.
    location /converted/ {
        alias /var/gallery/media/converted/;
        access_log off;
    }

    # Face crop thumbnails (apps/worker-faces writes faces/<xx>/<photoId>/<faceId>.jpg),
    # used by the admin "unnamed people" tagging UI.
    location /faces/ {
        alias /var/gallery/media/faces/;
        access_log off;
    }

    # Custom person avatars uploaded in admin (avatars/<xx>/<personId>.ext).
    location /avatars/ {
        alias /var/gallery/media/avatars/;
        access_log off;
    }

    # Staging originals (kept until convert + purge). Same UUID-path trust
    # model as /converted/; used as display fallback before AVIF exists.
    location /originals/ {
        alias /var/gallery/media/originals/;
        access_log off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 64m;
}
