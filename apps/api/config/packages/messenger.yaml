framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            convert:
                dsn: '%env(REDIS_URL)%/convert'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            faces:
                dsn: '%env(REDIS_URL)%/faces'
            tags:
                dsn: '%env(REDIS_URL)%/tags'
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            App\Message\ConvertMediaMessage: convert
            App\Message\DetectFacesMessage: faces
            App\Message\SuggestTagsMessage: tags

when@test:
    framework:
        messenger:
            transports:
                # Keep messages in memory during tests instead of touching Redis;
                # asserted via messenger.transport.convert / .faces / .tags services.
                convert: 'in-memory://'
                faces: 'in-memory://'
                tags: 'in-memory://'
