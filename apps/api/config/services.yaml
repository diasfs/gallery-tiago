# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(FACES_EMBED_URL): ''
    face.cluster_threshold: '%env(float:FACE_CLUSTER_THRESHOLD)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\FaceQueuePublisherInterface: '@App\Service\RedisFaceQueuePublisher'
    App\Service\TagQueuePublisherInterface: '@App\Service\RedisTagQueuePublisher'
    App\Service\GeocoderInterface: '@App\Service\NominatimGeocoder'
    App\Service\ViewDeduplicatorInterface: '@App\Service\RedisViewDeduplicator'
    App\Service\FaceEmbeddingClientInterface: '@App\Service\HttpFaceEmbeddingClient'

    App\Service\HttpFaceEmbeddingClient:
        arguments:
            $embedUrl: '%env(default::FACES_EMBED_URL)%'

    App\Service\FaceSimilarityService:
        arguments:
            $clusterThreshold: '%face.cluster_threshold%'

when@test:
    services:
        # Swap the real Redis publisher for an in-memory fake so the test
        # suite doesn't need a live Redis connection (mirrors the in-memory
        # transport swap for convert/faces/tags in config/packages/messenger.yaml).
        App\Tests\Fake\InMemoryFaceQueuePublisher: ~
        App\Service\FaceQueuePublisherInterface: '@App\Tests\Fake\InMemoryFaceQueuePublisher'
        App\Tests\Fake\InMemoryTagQueuePublisher: ~
        App\Service\TagQueuePublisherInterface: '@App\Tests\Fake\InMemoryTagQueuePublisher'
        App\Tests\Fake\FakeGeocoder:
            public: true
        App\Service\GeocoderInterface:
            alias: App\Tests\Fake\FakeGeocoder
            public: true
        App\Tests\Fake\InMemoryViewDeduplicator:
            public: true
        App\Service\ViewDeduplicatorInterface: '@App\Tests\Fake\InMemoryViewDeduplicator'
        App\Tests\Fake\FakeFaceEmbeddingClient:
            public: true
        App\Service\FaceEmbeddingClientInterface:
            alias: App\Tests\Fake\FakeFaceEmbeddingClient
            public: true
