map $http_user_agent $is_social_crawler {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*LinkedInBot 1;
    ~*WhatsApp 1;
    ~*TelegramBot 1;
    ~*Slackbot 1;
    ~*Discordbot 1;
    ~*Applebot 1;
    ~*Pinterest 1;
    ~*Googlebot 1;
    ~*bingbot 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # API + media (same paths the Vite proxy used)
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
    location /converted/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /faces/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /avatars/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /face-scans/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /originals/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Share preview: photo by UUID (/photos/{id})
    location ~ "^/photos/[0-9a-f-]{36}/?$" {
        if ($is_social_crawler) {
            proxy_pass http://api;
            break;
        }
        try_files $uri /index.html;
    }

    # Share preview: album by slug (/albums/{slug})
    location ~ "^/albums/[^/]+/?$" {
        if ($is_social_crawler) {
            proxy_pass http://api;
            break;
        }
        try_files $uri /index.html;
    }

    # Share preview: root photo URL (/{albumSlug}/{filename.ext})
    # Excludes known static prefixes to avoid proxying assets to the API.
    location ~ "^/(?!api|converted|faces|avatars|face-scans|originals|assets)[^/]+/[^/]+\.[a-z0-9]{2,5}/?$" {
        if ($is_social_crawler) {
            proxy_pass http://api;
            break;
        }
        try_files $uri /index.html;
    }

    # Share preview: root album URL (/{slug}) excluding reserved slugs
    location ~ "^/(?!search|map|timeline|memories|popular|albums|photos|people|tags|locations|admin|api|converted|originals|faces|avatars|assets)[^/]+/?$" {
        if ($is_social_crawler) {
            proxy_pass http://api;
            break;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
